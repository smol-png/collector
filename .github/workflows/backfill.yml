name: Backfill a week of history
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "7"
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backfill.py --days ${{ inputs.days }}
      - name: Match stories with Claude
        run: python matcher.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save
        run: |
          git config user.name "crypto-wire-bot"
          git config user.email "crypto-wire-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "backfill ${{ inputs.days }} days"
          git pull --rebase
          git push

name: Live collector
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"     # backup starter in case the chain ever breaks
permissions:
  contents: write
  actions: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check feeds every minute for 55 minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          python live.py --minutes 55
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run live.yml --ref main

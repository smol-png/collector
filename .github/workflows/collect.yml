name: Collect headlines
on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collector.py
      - name: Match stories with Claude
        run: python matcher.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save new data
        run: |
          git config user.name "crypto-wire-bot"
          git config user.email "crypto-wire-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
